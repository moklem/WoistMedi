<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="grass" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#7cb96a"/>
      <rect width="20" height="20" fill="#78b566" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grass)"/>

  <!-- Outer fence -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#4a7c2e" stroke-width="5" rx="14" stroke-dasharray="18,6"/>

  <!-- Main roads -->
  <!-- Horizontal -->
  <rect x="20" y="365" width="1160" height="70" fill="#b0936a"/>
  <line x1="20" y1="400" x2="1180" y2="400" stroke="#fff" stroke-width="2" stroke-dasharray="30,18" opacity="0.6"/>
  <!-- Vertical -->
  <rect x="550" y="20" width="100" height="760" fill="#b0936a"/>

  <!-- ==== LEFT TOP: Hauptbühne ==== -->
  <rect x="50" y="50" width="465" height="285" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <rect x="50" y="50" width="465" height="44" rx="12" fill="#f9a825"/>
  <text x="283" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">🎵 HAUPTBÜHNE</text>
  <rect x="130" y="140" width="300" height="160" rx="6" fill="#ffe082" stroke="#f57f17" stroke-width="2"/>
  <text x="283" y="215" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">🎤</text>
  <text x="283" y="258" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#795548">Stage</text>

  <!-- ==== RIGHT TOP: Zeltbereich ==== -->
  <rect x="685" y="50" width="465" height="285" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <rect x="685" y="50" width="465" height="44" rx="12" fill="#1565c0"/>
  <text x="917" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">⛺ ZELTBEREICH</text>
  <text x="785" y="175" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>
  <text x="917" y="175" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>
  <text x="1048" y="175" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>
  <text x="785" y="260" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>
  <text x="917" y="260" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>
  <text x="1048" y="260" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛺</text>

  <!-- Road label -->
  <text x="600" y="395" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.7)" letter-spacing="4">HAUPTWEG</text>

  <!-- ==== LEFT BOTTOM LEFT: Sport 1 ==== -->
  <rect x="50" y="465" width="220" height="285" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <rect x="50" y="465" width="220" height="44" rx="12" fill="#2e7d32"/>
  <text x="160" y="495" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">⚽ SPORT 1</text>
  <text x="160" y="600" font-family="Arial,sans-serif" font-size="48" text-anchor="middle">⚽</text>

  <!-- ==== LEFT BOTTOM RIGHT: Sport 2 ==== -->
  <rect x="295" y="465" width="220" height="285" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <rect x="295" y="465" width="220" height="44" rx="12" fill="#2e7d32"/>
  <text x="405" y="495" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">🏐 SPORT 2</text>
  <text x="405" y="600" font-family="Arial,sans-serif" font-size="48" text-anchor="middle">🏐</text>

  <!-- ==== RIGHT BOTTOM: Essen + Sanitär + Parkplatz ==== -->
  <!-- Essen -->
  <rect x="685" y="465" width="215" height="130" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="3"/>
  <rect x="685" y="465" width="215" height="40" rx="12" fill="#c62828"/>
  <text x="793" y="491" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">🍺 ESSEN</text>
  <text x="793" y="550" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🍕</text>

  <!-- Sanitär -->
  <rect x="920" y="465" width="230" height="130" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3"/>
  <rect x="920" y="465" width="230" height="40" rx="12" fill="#6a1b9a"/>
  <text x="1035" y="491" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">🚿 SANITÄR</text>
  <text x="1035" y="550" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🚿</text>

  <!-- Parkplatz -->
  <rect x="685" y="615" width="465" height="135" rx="12" fill="#eeeeee" stroke="#424242" stroke-width="3"/>
  <rect x="685" y="615" width="465" height="40" rx="12" fill="#424242"/>
  <text x="917" y="641" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">🅿 PARKPLATZ</text>
  <text x="800" y="710" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🚗</text>
  <text x="917" y="710" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🚗</text>
  <text x="1034" y="710" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🚗</text>

  <!-- ERSTE HILFE (small box top right) -->
  <rect x="1085" y="55" width="110" height="60" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="1140" y="78" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">ERSTE</text>
  <text x="1140" y="96" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">HILFE ➕</text>

  <!-- Compass -->
  <circle cx="80" cy="740" r="28" fill="rgba(255,255,255,0.85)" stroke="#555" stroke-width="1.5"/>
  <text x="80" y="748" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🧭</text>

  <!-- Placeholder watermark -->
  <rect x="300" y="368" width="600" height="64" fill="rgba(0,0,0,0.35)" rx="8"/>
  <text x="600" y="393" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-style="italic">PLATZHALTER — Echter Lageplan über 🗺 oben rechts einstellen</text>
  <text x="600" y="415" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)">medi Meisterschaft 2026 · Flugplatz Obermehler</text>
</svg>
